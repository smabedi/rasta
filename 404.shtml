<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رستا | ۴۰۴ - صفحه یافت نشد</title>
    <!--#include virtual="/includes/favicons.html" -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/error.css">
</head>
<body>
<div class="error-page-shell">
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>

    <!--#include virtual="/includes/header.html" -->

    <!-- Error Presentation Stage -->
    <main class="error-main">
        <div class="error-code-watermark">404</div>

        <div class="error-badge">
            <span class="badge-dot"></span>
            <span>خطای ۴۰۴ • آدرس نامعتبر</span>
        </div>

        <h1 class="error-title">ترکیب انتخابی شما در دسترس نیست</h1>

        <p class="error-desc">
            به بن‌بست رسیدیم! صفحه‌ای که می‌خواهید یا حذف شده یا از اول وجود نداشته است.<br>دقیقاً مثل خواب راحت تو سال کنکور، مگه نه؟
        </p>

        <div class="error-actions">
            <a href="/" class="btn-error-primary">
                <span>بازگشت به صفحه اصلی</span>
                <svg class="btn-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <a href="/management/major-matrix/" class="btn-error-outline">
                ورود به محیط ماتریس
            </a>
        </div>
    </main>

    <!--#include virtual="/includes/footer.html" -->
