<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رستا | ۴۰۰ - درخواست نامعتبر</title>
    <!--#include virtual="/includes/favicons.html" -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/error.css">
</head>
<body>
<div class="error-page-shell">
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>

    <!--#include virtual="/includes/header.html" -->

    <main class="error-main">
        <div class="error-code-watermark warning">400</div>

        <div class="error-badge warning">
            <span class="badge-dot"></span>
            <span>خطای ۴۰۰ • فرمت نامعتبر درخواست</span>
        </div>

        <h1 class="error-title">درخواست ارسالی نامعتبر است</h1>

        <p class="error-desc">
            ساختار این درخواست با استانداردهای رستا هم‌خوانی ندارد.<br>شاید یک کاراکتر در آدرس اشتباه شده. (مثل تستی که سر جلسه جابه‌جا زدید)
        </p>

        <div class="error-actions">
            <a href="/" class="btn-error-primary">
                <span>بازگشت به صفحه اصلی</span>
                <svg class="btn-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <a href="/management/major-matrix/" class="btn-error-outline">
                ورود به محیط ماتریس
            </a>
        </div>
    </main>

    <!--#include virtual="/includes/footer.html" -->
</div>
</body>
</html>
